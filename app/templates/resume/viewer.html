{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-header bg-white d-flex justify-content-between align-items-center">
                    <h5 class="card-title mb-0">
                        <i class="bi bi-file-text me-2"></i>{{ resume.original_filename }}
                    </h5>
                    <a href="{{ url_for('main.view_application', application_id=application.application_id) }}" 
                       class="btn btn-outline-primary btn-sm">
                        <i class="bi bi-arrow-left"></i> Back to Application
                    </a>
                </div>
                <div class="card-body p-0">
                    <div class="pdf-container text-center">
                        {{ pdf_display|safe }}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
