<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for("static", filename="css/style.css") }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">
    <title>{{ title }} - UMaT Job Portal</title>
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .auth-container {
            width: 90%;
            max-width: 900px;
            display: flex;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            background-color: white;
            min-height: 600px;
            max-height: 700px;
        }
        
        .auth-image {
            background-size: cover;
            background-position: center;
            width: 40%;
            min-height: 100%;
        }
        
        .login-bg {
            background-image: url("{{ url_for('static', filename='Login.png') }}");
        }
        
        .register-bg {
            background-image: url("{{ url_for('static', filename='register.png') }}");
            background-size: cover;
            background-position: center;
        }
        
        .auth-form-container {
            width: 60%;
            padding: 1.5rem;
            position: relative;
            overflow-y: auto;
        }
        
        .auth-logo-container {
            text-align: center;
            margin-bottom: 1rem;
        }
        
        .auth-logo {
            display: inline-block;
            background-color: white;
            border-radius: 50%;
            padding: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        
        .auth-logo:hover {
            transform: scale(1.05);
        }
        
        /* Auth button styles moved to style.css */
        
        .auth-form-label {
            font-weight: 600;
            color: #333;
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
        }
        
        .auth-form-control {
            border: 1px solid #ced4da;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.9rem;
            height: auto;
            transition: all 0.3s ease;
        }
        
        .auth-form-control:focus {
            border-color: #6351ce;
            box-shadow: 0 0 0 0.25rem rgba(99, 81, 206, 0.25);
        }
        
        .auth-form-title {
            font-weight: 700;
            color: #1c2331;
            margin-bottom: 1rem;
            text-align: center;
            font-size: 1.5rem;
        }
        
        .auth-card {
            border: none;
            width: 100%;
        }
        
        .small-text {
            font-size: 0.85rem;
        }
        
        @media (max-width: 992px) {
            .auth-container {
                flex-direction: column;
                max-width: 500px;
                max-height: none;
                height: auto;
            }
            .auth-image {
                width: 100%;
                min-height: 180px;
            }
            .auth-form-container {
                width: 100%;
                height: auto;
                max-height: none;
            }
            body {
                height: auto;
                padding: 40px 20px;
            }
        }
        
        @media (max-width: 576px) {
            .auth-container {
                width: 95%;
            }
            .auth-image {
                min-height: 150px;
            }
            body {
                padding: 20px 10px;
            }
        }
    </style>
</head>
<body>    
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-messages" style="position: fixed; top: 20px; right: 20px; z-index: 1000; width: 300px;">
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <div class="auth-container">
        {% block content %}{% endblock %}
    </div>

    <!-- Add Bootstrap JS and Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"></script>
</body>
</html>
